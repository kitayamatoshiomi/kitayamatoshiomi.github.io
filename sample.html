<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Base（サンプル：霧）</title>
<meta name="description" content="北山の仕事の基地。中央に Work Cosmos、四隅に Notion の完了数・教育と出版のニュース・よく使うドライブ・市場と出版社。">
<meta name="theme-color" content="#050810">

<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #050810;
    --card: rgba(14, 20, 34, .62);
    --line: rgba(255, 255, 255, .075);
    --line-2: rgba(255, 255, 255, .13);
    --text: #b8bccb;
    --dim: #7c8095;
    --faint: #5c5f70;
    --head: #dfe2ec;
    --gold: #eccd6e;
    --accent: #58c7d3;
    --cw: clamp(250px, 21vw, 340px);
    --gap: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Zen Kaku Gothic New", system-ui, sans-serif; font-size: 13px;
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }

  #view { position: fixed; inset: 0; display: block; cursor: grab; touch-action: none; }
  #view.grab { cursor: grabbing; }
  #view.node { cursor: pointer; }

  /* ---------- header ---------- */
  .top {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; pointer-events: none; white-space: nowrap;
  }
  .brand { font-family: "Outfit", sans-serif; font-weight: 400; font-size: .78rem; letter-spacing: .34em; color: var(--dim); }
  .clock { font-family: "Outfit", sans-serif; font-weight: 300; font-size: 1.02rem; letter-spacing: .06em; color: var(--head); font-variant-numeric: tabular-nums; }
  .date { font-family: "Outfit", sans-serif; font-size: .74rem; letter-spacing: .08em; color: var(--dim); }
  .sep { width: 1px; height: 12px; background: var(--line-2); }
  .iconbtn {
    pointer-events: auto; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line);
    background: rgba(24,25,34,.5); display: grid; place-items: center; cursor: pointer; color: var(--dim);
    transition: color .15s, border-color .15s;
  }
  .iconbtn:hover { color: var(--head); border-color: var(--line-2); }
  .iconbtn svg { width: 14px; height: 14px; }

  /* ---------- cards ---------- */
  .card {
    position: fixed; width: var(--cw); background: var(--card);
    -webkit-backdrop-filter: blur(12px) saturate(120%); backdrop-filter: blur(12px) saturate(120%);
    border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 14px 44px rgba(0,0,0,.36);
    display: flex; flex-direction: column; overflow: hidden;
    transition: border-color .4s, box-shadow .4s;
  }
  .card.ping { border-color: rgba(236,205,110,.5); box-shadow: 0 0 0 1px rgba(236,205,110,.18), 0 0 38px rgba(236,205,110,.16); }
  .tl { top: var(--gap); left: var(--gap); }
  .tr { top: var(--gap); right: var(--gap); height: calc(50vh - var(--gap) * 1.5); }
  .bl { bottom: var(--gap); left: var(--gap); top: calc(var(--gap) * 2 + var(--tlh, 150px)); }
  .br { bottom: var(--gap); right: var(--gap); height: calc(50vh - var(--gap) * 1.5); }

  .chead { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px 8px; }
  .chead .t { font-family: "Outfit", sans-serif; font-weight: 500; font-size: .72rem; letter-spacing: .24em; color: var(--head); }
  .chead .j { font-size: .7rem; color: var(--faint); }
  .chead .r { margin-left: auto; font-family: "Outfit", sans-serif; font-size: .68rem; color: var(--faint); letter-spacing: .04em; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; align-self: center; box-shadow: 0 0 8px currentColor; }

  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 6px 10px; scrollbar-width: thin; scrollbar-color: #33343f transparent; }
  .scroll::-webkit-scrollbar { width: 7px; }
  .scroll::-webkit-scrollbar-thumb { background: #33343f; border-radius: 4px; }
  .fade { -webkit-mask-image: linear-gradient(#000 calc(100% - 22px), transparent); mask-image: linear-gradient(#000 calc(100% - 22px), transparent); }

  /* top-left: done */
  .done { display: block; padding: 0 16px 14px; }
  .done .big { font-family: "Outfit", sans-serif; font-weight: 300; font-size: 3.1rem; line-height: 1; color: var(--head); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
  .done .big small { font-size: .9rem; font-weight: 400; color: var(--dim); margin-left: 6px; letter-spacing: .04em; }
  .done .sub { display: flex; gap: 12px; margin-top: 9px; font-size: .74rem; color: var(--dim); flex-wrap: wrap; }
  .done .sub b { color: var(--gold); font-weight: 500; font-family: "Outfit", sans-serif; }
  .done .go { margin-top: 10px; font-family: "Outfit", sans-serif; font-size: .68rem; letter-spacing: .12em; color: var(--faint); transition: color .15s; }
  .tl { cursor: pointer; }
  .tl:hover { border-color: var(--line-2); }
  .tl:hover .go { color: var(--accent); }
  .done .go .web { margin-left: 8px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 6px; font-size: .62rem; letter-spacing: .1em; color: var(--faint); }
  .done .go .web:hover { color: var(--head); border-color: var(--line-2); }

  /* top-right: news */
  .tabs { display: flex; gap: 4px; padding: 0 12px 6px; }
  .tab { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 11px; font-size: .72rem; color: var(--dim); cursor: pointer; }
  .tab.on { background: rgba(88,199,211,.13); border-color: rgba(88,199,211,.38); color: #cfeef1; }
  .news a { display: block; padding: 8px 9px; border-radius: 9px; transition: background .15s; }
  .news a:hover, .news a:focus-visible { background: rgba(255,255,255,.045); outline: none; }
  .news .h { color: #d4d8e3; font-size: .8rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .news .m { margin-top: 3px; font-size: .67rem; color: var(--faint); display: flex; gap: 6px; }
  .news .m .new { color: var(--gold); }
  .empty { padding: 18px 10px; color: var(--faint); font-size: .76rem; line-height: 1.7; }

  /* lists (drive / market) */
  .list .grp { font-family: "Outfit", sans-serif; font-size: .64rem; letter-spacing: .22em; color: var(--faint); padding: 10px 9px 4px; text-transform: uppercase; }
  .list a { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 9px; transition: background .15s; }
  .list a:hover, .list a:focus-visible { background: rgba(255,255,255,.05); outline: none; }
  .list a .n { flex: 1; min-width: 0; font-family: "Outfit", sans-serif; font-size: .84rem; color: #d2d6e2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list a .jp { font-size: .7rem; color: var(--faint); white-space: nowrap; }
  .list a.first { background: rgba(143,191,114,.08); }
  .list a.first .n { color: #fff; }
  .finder { margin: 2px 12px 6px; display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 9px; padding: 5px 9px; background: rgba(0,0,0,.18); }
  .finder:focus-within { border-color: rgba(92,182,179,.45); }
  .finder svg { width: 12px; height: 12px; color: var(--faint); flex: none; }
  .finder input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; font-size: .76rem; }
  .finder input::placeholder { color: var(--faint); }

  /* ---------- dialogue dock ---------- */
  .dock {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    width: min(560px, calc(100vw - var(--cw) * 2 - var(--gap) * 4 - 16px));
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  .log { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .log .ln { font-size: .76rem; color: var(--dim); background: rgba(19,19,26,.66); border: 1px solid var(--line); padding: 4px 11px; border-radius: 999px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: rise .35s ease-out; transition: opacity .6s; }
  .log .ln.me { color: #e6e9f1; }
  .log .ln.old { opacity: .45; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .bar {
    pointer-events: auto; display: flex; align-items: center; gap: 10px;
    background: rgba(24,25,34,.72); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid var(--line-2); border-radius: 16px; padding: 7px 7px 7px 16px;
    box-shadow: 0 16px 50px rgba(0,0,0,.45);
    transition: border-color .25s, box-shadow .25s;
  }
  .bar:focus-within { border-color: rgba(236,205,110,.42); box-shadow: 0 0 0 3px rgba(236,205,110,.07), 0 16px 50px rgba(0,0,0,.45); }
  .bar .spark { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); flex: none; animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .45; transform: scale(.8); } }
  .bar input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; font-size: .9rem; padding: 6px 0; color: #eef0f6; }
  .bar input::placeholder { color: var(--faint); }
  .send { width: 34px; height: 34px; border-radius: 11px; border: 0; background: rgba(236,205,110,.14); color: var(--gold); display: grid; place-items: center; cursor: pointer; transition: background .15s; }
  .send:hover { background: rgba(236,205,110,.26); }
  .send svg { width: 15px; height: 15px; }

  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #7c8095; font: 13px system-ui; background: #13131a; white-space: pre-wrap; text-align: center; padding: 24px; z-index: 9; }

  /* ---------- narrow screens: stack the cards ---------- */
  @media (max-width: 860px) {
    body { overflow: auto; }
    .wrap { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 64px 12px 110px; }
    .card { position: relative; top: auto !important; left: auto !important; right: auto !important; bottom: auto !important; width: 100%; height: auto !important; max-height: 60vh; }
    .dock { width: calc(100vw - 24px); }
    .top .date, .top .sep { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .bar .spark { animation: none; } }
</style>
</head>
<body>
<canvas id="view" aria-label="Work Cosmos"></canvas>
<noscript><div style="position:fixed;inset:0;display:grid;place-items:center">JavaScript を有効にしてください。</div></noscript>
<div id="boot">Loading…</div>

<header class="top">
  <span class="brand">WORK&nbsp;BASE</span>
  <span class="sep"></span>
  <span class="clock" id="clock">--:--</span>
  <span class="date" id="date"></span>
  <button class="iconbtn" id="fsBtn" title="全画面（F キー / 背景をダブルクリック）" aria-label="全画面">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
  </button>
</header>

<div class="wrap">
  <!-- top-left: Notion done -->
  <section class="card tl" id="tl" title="Notion「今週の作業板」をデスクトップ版アプリで開く">
    <div class="chead"><span class="dot" style="color:var(--gold);background:var(--gold)"></span><span class="t">DONE</span><span class="j">完了済みタスク</span></div>
    <div class="done">
      <div class="big"><span id="doneN">—</span><small>tasks</small></div>
      <div class="sub"><span id="doneDelta"></span><span id="doneToday"></span></div>
      <div class="go">NOTION&nbsp;→&nbsp; <span id="doneAt"></span>
        <a class="web" id="notionWeb" href="https://www.notion.so/32667766d902813fb566d2e6d8d9513f" target="_blank" rel="noopener" title="ブラウザ版で開く">web</a>
      </div>
    </div>
  </section>

  <!-- top-right: news -->
  <section class="card tr" id="tr">
    <div class="chead"><span class="dot" style="color:var(--accent);background:var(--accent)"></span><span class="t">NEWS</span><span class="j">教育・出版</span><span class="r" id="newsAt"></span></div>
    <div class="tabs" role="tablist">
      <button class="tab on" data-k="edu" role="tab">教育</button>
      <button class="tab" data-k="pub" role="tab">出版</button>
    </div>
    <div class="scroll fade news" id="newsList"><div class="empty">読み込み中…</div></div>
  </section>

  <!-- bottom-left: drive -->
  <section class="card bl" id="bl">
    <div class="chead"><span class="dot" style="color:#8fbf72;background:#8fbf72"></span><span class="t">DRIVE</span><span class="j">よく使う</span></div>
    <div class="finder" title="Google ドライブ「編集中」直下のフォルダを検索">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14" stroke-linecap="round"/></svg>
      <input id="finder" placeholder="編集中を検索（先生名・書名）" autocomplete="off">
    </div>
    <div class="scroll fade list" id="driveList"></div>
  </section>

  <!-- bottom-right: market -->
  <section class="card br" id="br">
    <div class="chead"><span class="dot" style="color:#d9a441;background:#d9a441"></span><span class="t">MARKET</span><span class="j">Amazon・出版社</span></div>
    <div class="scroll fade list" id="marketList"></div>
  </section>
</div>

<!-- bottom-centre: dialogue (form only for now) -->
<div class="dock">
  <div class="log" id="log"></div>
  <form class="bar" id="bar" autocomplete="off">
    <span class="spark"></span>
    <input id="cmd" placeholder="Base に話しかける…　（例：gmail / 編集中 / 全画面）" aria-label="コマンド">
    <button class="send" type="submit" aria-label="送信">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
    </button>
  </form>
</div>

<script>
function __bootErr(e) {
  var b = document.getElementById("boot");
  if (b) { b.textContent = "Work Base の起動に失敗しました。\n\n" + (e && (e.stack || e.message) || e) + "\n\nこの画面をスクショして送ってください。"; b.style.color = "#e08a8a"; }
}
window.addEventListener("error", function (ev) { __bootErr(ev.error || ev.message); });

(function () {
try {
  // ================================================================= CONFIG
  var A = "authuser=0";
  var EDIT_PARENT = "19e1XLVpyfmhm_oGxluYGKvCx4u8auywX";   // Drive「編集中」
  var GROUPS = [
    { k: "base",   jp: "Base",        col: "#8fbf72", big: true },
    { k: "prog",   jp: "in progress", col: "#5cb6b3", big: true },
    { k: "market", jp: "market",      col: "#d9a441" },
    { k: "comp",   jp: "Competitors", col: "#b48ead" },
    { k: "office", jp: "Office work", col: "#6d8fd0" },
    { k: "other",  jp: "other",       col: "#cf7a6a" }
  ];
  // [group, label, 日本語, url, 四隅のどこに並べるか（drive / amazon / pub）]
  var TOOLS = [
    ["Base","Gmail","メール","https://mail.google.com/mail/?"+A,"drive"],
    ["Base","Calendar","カレンダー","https://calendar.google.com/calendar/r?"+A,"drive"],
    ["Base","Portal","ポータル","https://sites.google.com/toyokan.co.jp/portal/%E3%83%9B%E3%83%BC%E3%83%A0?"+A,"drive"],
    ["Base","Toyokan site","東洋館","https://www.toyokan.co.jp/"],
    ["in progress","Projects sheet","企画一覧","https://docs.google.com/spreadsheets/d/1XI3lXlDdiK_qWv9MNIamiDzWLgY-mS5vmnK3rmb04rw/edit?"+A,"drive"],
    ["in progress","Editing folder","編集中","https://drive.google.com/drive/folders/"+EDIT_PARENT+"?"+A,"drive"],
    ["in progress","Management folder","管理","https://drive.google.com/drive/folders/1-kgoU2Rb5EyUhGzumdMvEN7YznB5exCP?"+A,"drive"],
    ["in progress","Proposals folder","企画書","https://drive.google.com/drive/folders/1Zkz084sQ6FpfXGKSUZHXyjAkyc6zD0RZ?"+A,"drive"],
    ["market","Amazon overall","Amazon 本 総合","https://www.amazon.co.jp/gp/bestsellers/books/","amazon"],
    ["market","Amazon Toyokan","Amazon 東洋館","https://www.amazon.co.jp/gp/bestsellers/books/12874471","amazon"],
    ["market","New: teachers","教師向け 新着","https://www.amazon.co.jp/gp/new-releases/books/554292/","amazon"],
    ["market","Business how-to","ビジネス実用","https://www.amazon.co.jp/gp/bestsellers/books/492066","amazon"],

    ["market","Education / practice","教育・実務書","https://www.amazon.co.jp/gp/bestsellers/books/12867251","amazon"],

    ["Office work","MF Payable","MF 債務支払","https://payable.moneyforward.com/"],
    ["Office work","CloudSign","クラウドサイン","https://app.cloudsign.jp/"],
    ["Office work","Yamato B2","ヤマト B2","https://bmypage.kuronekoyamato.co.jp/bmypage/servlet/jp.co.kuronekoyamato.wur.hmp.servlet.user.HMPLGI0010JspServlet"],
    ["Competitors","Meiji Tosho","明治図書","https://www.meijitosho.co.jp/search/?title=%90V%8A%A7%8F%91%90%D0","pub"],
    ["Competitors","Gakuyo Shobo","学陽書房","https://www.gakuyo.co.jp/search/g6008.html","pub"],
    ["Competitors","Gakuji Shuppan","学事出版","https://www.gakuji.co.jp/","pub"],
    ["Competitors","Reimei Shobo","黎明書房","http://www.reimei-shobo.com/","pub"],
    ["Competitors","Gakugei Mirai","学芸みらい社","https://www.gakugeimirai.jp/","pub"],
    ["Competitors","Forum A","フォーラム・A","https://foruma.co.jp/","pub"],
    ["other","Coworking","コワーキング","https://jrwd-workspace.com/"],
    ["other","Messenger","メッセンジャー","https://www.facebook.com/messages/"]
  ];
  var DATA_REFRESH_MIN = 10;
  var NOTION_PAGE = "32667766d902813fb566d2e6d8d9513f";      // 今週の作業板

  // ================================================================= CENTER: 霧の中の星（線なし）
  var canvas = document.getElementById("view"), ctx = canvas.getContext("2d");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var TAU = Math.PI * 2, DPR = Math.min(window.devicePixelRatio || 1, 2), W = 0, H = 0;
  var GI = {}; GROUPS.forEach(function (g, i) { GI[g.jp] = i; });
  var nodes = [], BYLABEL = {};
  function rr(a, b) { return a + Math.random() * (b - a); }

  // --- 星（ツール）は定位置＋ゆらぎ。グループごとの雲のかたまりに配置 ---
  function star(n, hx, hy) {
    n.hx = hx; n.hy = hy; n.x = hx; n.y = hy; n.ph = Math.random() * TAU;
    n.sw = rr(0.6, 1.5); n.glow = 0; n.id = nodes.length; nodes.push(n); return n;
  }
  GROUPS.forEach(function (g, i) {
    var a = (-90 + i * 60) * Math.PI / 180, hx = Math.cos(a) * 205, hy = Math.sin(a) * 205;
    g.node = star({ kind: "hub", label: g.jp, gi: i, col: g.col, r: 5.6 }, hx, hy);
    var mine = TOOLS.filter(function (t) { return t[0] === g.jp; });
    mine.forEach(function (t, j) {
      var sp = (j - (mine.length - 1) / 2) * 0.42;
      var rad = 108 + (j % 2 ? 26 : 0);
      var tx = hx + Math.cos(a + sp) * rad, ty = hy + Math.sin(a + sp) * rad;
      BYLABEL[t[1]] = star({ kind: "tool", label: t[1], jp: t[2], url: t[3], gi: i, col: g.col, r: 3.4 }, tx, ty);
    });
  });
  // 飾りの小さな星（クリック不可）。霧に混ざって漂う
  for (var d = 0; d < 120; d++) {
    var da = Math.random() * TAU, dr = Math.pow(Math.random(), 0.65) * 430 + 60;
    star({ kind: "dust", gi: -1, col: Math.random() < 0.7 ? "#9fb0cc" : GROUPS[(Math.random() * 6) | 0].col, r: rr(0.9, 2.1) },
      Math.cos(da) * dr, Math.sin(da) * dr * 0.86);
  }

  // ---------- camera ----------
  var cam = { x: 0, y: 0, z: 1 }, camT = null, rot = 0, spin = 1, narrow = false, userZoomed = false;
  function W2S(x, y) {
    var c = Math.cos(rot), s = Math.sin(rot), dx = x - cam.x, dy = y - cam.y;
    return [(dx * c - dy * s) * cam.z + W / 2, (dx * s + dy * c) * cam.z + H / 2];
  }
  function S2W(sx, sy) {
    var c = Math.cos(-rot), s = Math.sin(-rot), dx = (sx - W / 2) / cam.z, dy = (sy - H / 2) / cam.z;

    document.getElementById("doneDelta").innerHTML = base != null ? "今日 <b>+" + Math.max(0, n.done - base) + "</b>" : "";
    document.getElementById("doneToday").innerHTML = n.today != null ? "今日やること <b>" + n.today + "</b>" : "";
    document.getElementById("doneAt").textContent = n.updated ? fmtTime(n.updated) + " 時点" : "";
    if (lastDone != null && n.done > lastDone) { ping("tl"); flareUp(0.7); }
    lastDone = n.done;
  }
  function renderNews() {
    var box = document.getElementById("newsList");
    document.querySelectorAll(".tab").forEach(function (b) { b.classList.toggle("on", b.dataset.k === newsTab); });
    var items = news && news[newsTab];
    if (!items || !items.length) { box.innerHTML = "<div class='empty'>ニュースはまだ届いていません。<br>（GitHub で公開すると毎時自動で更新されます）</div>"; return; }
    box.innerHTML = items.map(function (x) {
      var fresh = x.time && (Date.now() - new Date(x.time).getTime()) < 3 * 3600e3;
      return "<a href='" + esc(x.url) + "' target='_blank' rel='noopener'><div class='h'>" + esc(x.title) + "</div>" +
        "<div class='m'>" + (fresh ? "<span class='new'>●</span>" : "") + "<span>" + esc(x.source) + "</span><span>" + ago(x.time) + "</span></div></a>";
    }).join("");
    box.scrollTop = 0;
    document.getElementById("newsAt").textContent = news.updated ? "更新 " + fmtTime(news.updated) : "";
  }
  document.querySelectorAll(".tab").forEach(function (b) {
    b.addEventListener("click", function () { newsTab = b.dataset.k; try { localStorage.setItem("wb-news-tab", newsTab); } catch (x) {} renderNews(); });
  });

  function loadData(first) {
    getJSON("data/notion.json").then(renderNotion, function () { if (first === true) renderNotion(FALLBACK_NOTION); });
    getJSON("data/news.json").then(function (j) {
      news = j; renderNews();
      var head = (j.edu && j.edu[0] && j.edu[0].url) + "|" + (j.pub && j.pub[0] && j.pub[0].url);
      if (seenNews && seenNews !== head) { ping("tr"); flareUp(0.5); say("新しいニュースが入りました"); }
      seenNews = head; try { localStorage.setItem("wb-seen", JSON.stringify(head)); } catch (x) {}
    }, function () { if (first === true) renderNews(); });
  }

  // ================================================================= DIALOGUE (form only — AI later)
  var logEl = document.getElementById("log");
  function say(text, who) {
    var d = document.createElement("div");
    d.className = "ln" + (who === "me" ? " me" : "");
    d.textContent = text;
    logEl.appendChild(d);
    while (logEl.children.length > 3) logEl.removeChild(logEl.firstChild);
    var all = logEl.children;
    for (var i = 0; i < all.length; i++) all[i].classList.toggle("old", i < all.length - 2);
    clearTimeout(say.t); say.t = setTimeout(function () { logEl.innerHTML = ""; }, 14000);
  }
  function norm(s) { return s.toLowerCase().replace(/[\s・　]/g, ""); }
  function findTools(q) {
    var nq = norm(q);
    if (!nq) return [];
    return nodes.filter(function (n) {
      if (n.kind !== "tool") return false;
      var en = norm(n.label), jp = norm(n.jp || "");
      return en.indexOf(nq) >= 0 || (jp && (jp.indexOf(nq) >= 0 || nq.indexOf(jp) >= 0)) || (nq.length > 3 && nq.indexOf(en) >= 0);
    });
  }
  document.getElementById("bar").addEventListener("submit", function (e) {
    e.preventDefault();
    var inp = document.getElementById("cmd"), q = inp.value.trim();
    inp.value = "";
    flareUp(1);
    if (!q) return;
    say(q, "me");
    if (/^(全画面|ぜんがめん|full(screen)?|fs)$/i.test(q)) { toggleFS(); say("全画面を切り替えました"); return; }
    if (/^(リセット|reset|home)$/i.test(q)) {
      userZoomed = false; camT = { t0: performance.now(), dur: 700, fx: cam.x, fy: cam.y, fz: cam.z, tx: 0, ty: 0, tz: fitZ() }; say("視点を戻しました"); return;
    }
    var wantsOpen = /(開いて|ひらいて|開く)$|^(open|o)\s/i.test(q);
    var key = q.replace(/(を)?(開いて|ひらいて|開く)$/, "").replace(/^(open|o)\s+/i, "").trim();
    var hits = findTools(key);
    if (hits.length) {
      hits.forEach(function (n) { n.glow = 1.6; var hub = GROUPS[n.gi].node; hub.glow = Math.max(hub.glow, 1); });
      if (wantsOpen && hits.length === 1) { window.open(hits[0].url, "_blank", "noopener"); say(hits[0].label + " を開きました"); }
      else say(hits.map(function (n) { return n.label; }).join("・") + " を光らせました — 星をクリックで開きます");
    } else {
      say("（対話 AI はまだ準備中です。いまは星の名前で光らせたり、「〜を開いて」で開いたりできます）");
    }
  });

  // ================================================================= START
  var __b = document.getElementById("boot"); if (__b) __b.parentNode.removeChild(__b);
  resize();
  var z0 = fitZ(); cam.z = z0 * 0.55;
  camT = { t0: performance.now(), dur: 1600, fx: 0, fy: 0, fz: z0 * 0.55, tx: 0, ty: 0, tz: z0 };
  setTimeout(function () { flareUp(0.8); }, 900);
  loadData(true);
  setInterval(loadData, DATA_REFRESH_MIN * 60000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) loadData(); });
  requestAnimationFrame(frame);
} catch (e) { __bootErr(e); }
})();
</script>
</body>
</html>
