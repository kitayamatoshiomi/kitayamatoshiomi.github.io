<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Base</title>
<meta name="description" content="北山の仕事の基地。中央に霧と星、四隅に Notion の完了数・教育と出版のニュース・よく使うドライブ・市場と出版社。">
<meta name="theme-color" content="#050810">
<meta name="robots" content="noindex, nofollow, noarchive">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="shortcut icon" href="WORK.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #050810;
    --card: rgba(14, 20, 34, .62);
    --line: rgba(255, 255, 255, .075);
    --line-2: rgba(255, 255, 255, .13);
    --text: #cfd5e3;
    --dim: #a2aabe;
    --faint: #868ea3;
    --head: #f2f4fa;
    --gold: #eccd6e;
    --accent: #58c7d3;
    --cw: clamp(250px, 21vw, 340px);
    --gap: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Zen Kaku Gothic New", system-ui, sans-serif; font-size: 13px;
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }

  #view { position: fixed; inset: 0; display: block; cursor: grab; touch-action: none; }
  #view.grab { cursor: grabbing; }
  #view.node { cursor: pointer; }

  /* ---------- header ---------- */
  .top {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; pointer-events: none; white-space: nowrap;
  }
  .brand { font-family: "Outfit", sans-serif; font-weight: 400; font-size: .78rem; letter-spacing: .34em; color: var(--dim); }
  .clock { font-family: "Outfit", sans-serif; font-weight: 300; font-size: 1.02rem; letter-spacing: .06em; color: var(--head); font-variant-numeric: tabular-nums; }
  .date { font-family: "Outfit", sans-serif; font-size: .74rem; letter-spacing: .08em; color: var(--dim); }
  .sep { width: 1px; height: 12px; background: var(--line-2); }
  .iconbtn {
    pointer-events: auto; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line);
    background: rgba(24,25,34,.5); display: grid; place-items: center; cursor: pointer; color: var(--dim);
    transition: color .15s, border-color .15s;
  }
  .iconbtn:hover { color: var(--head); border-color: var(--line-2); }
  .iconbtn svg { width: 14px; height: 14px; }

  /* ---------- cards ---------- */
  .card {
    position: fixed; width: var(--cw); background: var(--card);
    -webkit-backdrop-filter: blur(12px) saturate(120%); backdrop-filter: blur(12px) saturate(120%);
    border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 14px 44px rgba(0,0,0,.36);
    display: flex; flex-direction: column; overflow: hidden;
    transition: border-color .4s, box-shadow .4s;
  }
  .card.ping { border-color: rgba(236,205,110,.5); box-shadow: 0 0 0 1px rgba(236,205,110,.18), 0 0 38px rgba(236,205,110,.16); }
  .col {
    position: fixed; top: var(--gap); bottom: var(--gap); width: var(--cw);
    display: flex; flex-direction: column; gap: 11px; pointer-events: none;
  }
  .col.left { left: var(--gap); }
  .col.right { right: var(--gap); }
  .col .card { position: relative; width: 100%; pointer-events: auto; }
  .card.fill { flex: 1 1 auto; min-height: 96px; }
  .card.fixed { flex: 0 0 auto; }
  .card.half { flex: 1 1 34%; min-height: 120px; }
  #tr { flex: 1 1 36%; }
  #mk { flex: 1 1 30%; min-height: 186px; }
  #br { flex: 1 1 32%; }

  .chead { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px 8px; }
  .chead .t { font-family: "Outfit", sans-serif; font-weight: 500; font-size: .72rem; letter-spacing: .24em; color: var(--head); }
  .chead .j { font-size: .7rem; color: var(--faint); }
  .chead .r { margin-left: auto; font-family: "Outfit", sans-serif; font-size: .68rem; color: #9aa3b8; letter-spacing: .04em; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; align-self: center; box-shadow: 0 0 8px currentColor; }

  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 6px 10px; scrollbar-width: thin; scrollbar-color: #33343f transparent; }
  .scroll::-webkit-scrollbar { width: 7px; }
  .scroll::-webkit-scrollbar-thumb { background: #33343f; border-radius: 4px; }
  .fade { -webkit-mask-image: linear-gradient(#000 calc(100% - 22px), transparent); mask-image: linear-gradient(#000 calc(100% - 22px), transparent); }

  /* top-left: done */
  .done { display: block; padding: 0 16px 14px; }
  .done .big { font-family: "Outfit", sans-serif; font-weight: 400; font-size: 4.5rem; line-height: .95; color: #ffffff; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
  .done .big small { font-size: 1rem; font-weight: 400; color: var(--dim); margin-left: 8px; letter-spacing: .04em; }
  .done .sub { display: flex; gap: 14px; margin-top: 11px; font-size: .84rem; color: var(--text); flex-wrap: wrap; }
  .done .sub b { font-size: 1rem; }

  .done .sub b { color: var(--gold); font-weight: 500; font-family: "Outfit", sans-serif; }
  .done .go { margin-top: 10px; font-family: "Outfit", sans-serif; font-size: .68rem; letter-spacing: .12em; color: var(--faint); transition: color .15s; }
  .tl { cursor: pointer; }
  .tl:hover { border-color: var(--line-2); }
  .tl:hover .go { color: var(--accent); }
  .done .go .web { margin-left: 8px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 6px; font-size: .62rem; letter-spacing: .1em; color: var(--faint); }
  .done .go .web:hover { color: var(--head); border-color: var(--line-2); }

  /* top-right: news */
  .tabs { display: flex; gap: 4px; padding: 0 12px 6px; }
  .tab { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 11px; font-size: .72rem; color: var(--dim); cursor: pointer; }
  .tab.on { background: rgba(88,199,211,.13); border-color: rgba(88,199,211,.38); color: #cfeef1; }
  .news a { display: block; padding: 8px 9px; border-radius: 9px; transition: background .15s; }
  .news a:hover, .news a:focus-visible { background: rgba(255,255,255,.045); outline: none; }
  .news .h { color: #e5e9f2; font-size: .8rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .news .m { margin-top: 5px; font-size: .78rem; color: #b3bbcd; display: flex; gap: 8px; align-items: baseline; }
  .news .m .src { color: #dae0ec; font-weight: 500; }
  .news .m .ago { color: #a7b0c4; }
  .news .m .new { color: var(--gold); }
  .empty { padding: 18px 10px; color: var(--faint); font-size: .76rem; line-height: 1.7; }

  /* lists (drive / market) */
  .list .grp { font-family: "Outfit", sans-serif; font-size: .64rem; letter-spacing: .22em; color: var(--faint); padding: 10px 9px 4px; text-transform: uppercase; }
  .list a { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 9px; transition: background .15s; }
  .list a:hover, .list a:focus-visible { background: rgba(255,255,255,.05); outline: none; }
  .list a .n { flex: 1; min-width: 0; font-family: "Outfit", sans-serif; font-size: .84rem; color: #e4e8f2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list a .jp { font-size: .7rem; color: var(--faint); white-space: nowrap; }
  .list a.first { background: rgba(143,191,114,.08); }
  .list a.first .n { color: #fff; }
  .finder { margin: 2px 12px 6px; display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 9px; padding: 5px 9px; background: rgba(0,0,0,.18); }
  .finder:focus-within { border-color: rgba(92,182,179,.45); }
  .finder svg { width: 12px; height: 12px; color: var(--faint); flex: none; }
  .finder input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; font-size: .76rem; }
  .finder input::placeholder { color: var(--faint); }

  /* today：秘書と決めた1〜3件 */
  .today .tlist { padding: 0 13px 13px; display: flex; flex-direction: column; gap: 7px; }
  .today .one {
    display: flex; align-items: flex-start; gap: 9px; padding: 10px 11px;
    border: 1px solid rgba(180,142,173,.28); border-radius: 11px; background: rgba(180,142,173,.07);
    transition: border-color .15s, background .15s;
  }
  .today .one:hover { border-color: rgba(180,142,173,.5); background: rgba(180,142,173,.12); }
  .today .one .no {
    flex: none; width: 19px; height: 19px; border-radius: 6px; display: grid; place-items: center;
    font-family: "Outfit", sans-serif; font-size: .66rem; font-weight: 600;
    background: rgba(180,142,173,.25); color: #efe2f2; cursor: pointer; margin-top: 1px;
  }
  .today .one .tx { flex: 1; min-width: 0; font-size: .88rem; line-height: 1.5; color: #f3f5fb; }
  .today .one.solo .tx { font-size: 1.04rem; font-weight: 500; }
  .today .one.done { opacity: .5; }
  .today .one.done .tx { text-decoration: line-through; }
  .today .one.done .no { background: rgba(180,142,173,.5); }
  .today .carry { display: inline-block; margin-left: 7px; font-family: "Outfit", sans-serif; font-size: .62rem; padding: 1px 5px; border-radius: 5px; background: rgba(255,255,255,.07); color: var(--dim); vertical-align: 1px; }
  .today .carry.warn { background: rgba(224,134,127,.16); color: #e8a29c; }
  .today .none { padding: 4px 13px 14px; font-size: .76rem; color: var(--faint); line-height: 1.7; }
  .today .none a { color: var(--dim); text-decoration: underline; text-decoration-color: rgba(255,255,255,.2); }

  /* quotes (株価・為替・投信) */
  .q a { display: flex; align-items: baseline; gap: 8px; padding: 6px 9px; border-radius: 9px; transition: background .15s; }
  .q a:hover, .q a:focus-visible { background: rgba(255,255,255,.05); outline: none; }
  .q .nm { flex: 1; min-width: 0; font-size: .76rem; color: #dde2ed; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q .v { font-family: "Outfit", sans-serif; font-size: .82rem; color: var(--head); font-variant-numeric: tabular-nums; }
  .q .ch { width: 62px; height: 20px; flex: none; opacity: .85; }
  .q .d { font-family: "Outfit", sans-serif; font-size: .7rem; font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
  .up { color: #79c7a0; } .down { color: #e0867f; } .flat { color: var(--faint); }

  /* sparkline */
  .spk { display: block; overflow: visible; }

  /* 保管庫（Obsidian）の本数 */
  .vault .nums { display: flex; gap: 6px; padding: 0 11px 12px; }
  .vault .nums a { flex: 1; min-width: 0; text-align: center; padding: 7px 4px 6px; border: 1px solid var(--line); border-radius: 10px; background: rgba(0,0,0,.16); }
  .vault .nums a:hover { border-color: var(--line-2); background: rgba(255,255,255,.04); }
  .vault .nums .n { display: block; font-family: "Outfit", sans-serif; font-size: 1.12rem; color: var(--head); line-height: 1.1; }
  .vault .nums .l { display: block; font-size: .62rem; color: var(--faint); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vault .nums .df { display: block; font-family: "Outfit", sans-serif; font-size: .6rem; margin-top: 2px; }

  /* 下部：対話窓＋よく使うドライブ＋天気 */
  .bottom {
    position: fixed; left: 50%; bottom: 15px; transform: translateX(-50%);
    width: min(760px, calc(100vw - var(--cw) * 2 - var(--gap) * 4 - 26px));
    display: flex; flex-direction: column; gap: 9px; pointer-events: none; z-index: 3;
  }
  .bottom > * { pointer-events: auto; }
  .tiles {
    background: rgba(9,16,28,.72); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid rgba(91,214,245,.18); border-radius: 12px; padding: 8px 9px 7px;
    box-shadow: 0 14px 44px rgba(0,0,0,.36);
  }
  .tiles .th { display: flex; align-items: baseline; margin: 0 2px 7px; }
  .tiles .th .t { font-family: "Outfit", sans-serif; font-size: .64rem; letter-spacing: .2em; color: #b6e4f3; }
  .tiles .th .c { margin-left: auto; font-family: "Outfit", sans-serif; font-size: .62rem; color: #6ec8a0; }
  .tiles .gr { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .tiles a {
    display: flex; align-items: center; gap: 7px; padding: 5px 7px; min-width: 0;
    border: 1px solid rgba(91,214,245,.14); border-radius: 7px; background: rgba(14,26,44,.6);
    transition: border-color .15s, background .15s;
  }
  .tiles a:hover, .tiles a:focus-visible { background: rgba(91,214,245,.1); border-color: rgba(91,214,245,.4); outline: none; }
  .tiles .ic {
    width: 17px; height: 17px; flex: none; border-radius: 5px; display: grid; place-items: center;
    font-family: "Outfit", sans-serif; font-size: .58rem; font-weight: 600; color: #08101c;
  }
  .tiles .tx { min-width: 0; line-height: 1.15; }
  .tiles .nm { display: block; font-family: "Outfit", sans-serif; font-size: .72rem; font-weight: 500; color: #f1f4fa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tiles .sb { display: block; font-family: "Outfit", sans-serif; font-size: .56rem; letter-spacing: .04em; color: #92c2d6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tiles .ft { display: flex; align-items: center; gap: 7px; margin: 7px 2px 1px; border-top: 1px solid rgba(91,214,245,.12); padding-top: 6px; }
  .tiles .ft .spark { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 7px var(--gold); flex: none; animation: breathe 3.2s ease-in-out infinite; }
  .tiles .ft input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; font-size: .7rem; color: #dfe6f2; padding: 1px 0; }
  .tiles .ft input::placeholder { color: #8fb9cc; }
  .tiles .ft .send { width: 18px; height: 18px; border-radius: 5px; border: 0; background: rgba(236,205,110,.14); color: var(--gold); display: grid; place-items: center; cursor: pointer; }
  .tiles .ft .send:hover { background: rgba(236,205,110,.28); }
  .tiles .ft .send svg { width: 11px; height: 11px; }

  .wxbar {
    padding: 1px 0 2px;
    display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap;
    font-size: .72rem; color: var(--dim);
  }
  .wxbar a { display: flex; align-items: center; gap: 5px; }
  .wxbar a:hover { color: var(--head); }
  .wxbar .ic { font-size: .95rem; line-height: 1; }
  .wxbar .t { font-family: "Outfit", sans-serif; color: var(--head); font-size: .8rem; }
  .wxbar .mm { color: var(--faint); font-size: .68rem; font-family: "Outfit", sans-serif; }
  .wxbar .pop { color: #7fb4e0; font-size: .66rem; }
  .wxbar .tm { color: var(--faint); }

  /* ---------- dialogue dock ---------- */
  .dock {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    width: min(560px, calc(100vw - var(--cw) * 2 - var(--gap) * 4 - 16px));
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  .log { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .log .ln { font-size: .78rem; color: var(--text); background: rgba(19,19,26,.66); border: 1px solid var(--line); padding: 4px 11px; border-radius: 999px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: rise .35s ease-out; transition: opacity .6s; }
  .log .ln.me { color: #e6e9f1; }
  .log .ln.old { opacity: .45; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #7c8095; font: 13px system-ui; background: #050810; white-space: pre-wrap; text-align: center; padding: 24px; z-index: 9; }

  /* ---------- narrow screens: stack the cards ---------- */
  @media (max-width: 860px) {
    body { overflow: auto; }
    .wrap { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 64px 12px 110px; }
    .col { position: relative; top: auto; bottom: auto; left: auto !important; right: auto !important; width: 100%; pointer-events: auto; }
    .card { position: relative; width: 100%; height: auto !important; max-height: 60vh; flex: 0 0 auto !important; }
    .top .wx { display: none; }
    .bottom { position: relative; left: auto; bottom: auto; transform: none; width: 100%; margin: 0 0 14px; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .top .date, .top .sep { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .bar .spark { animation: none; } }
</style>
</head>
<body>
<canvas id="view" aria-label="Work Cosmos"></canvas>
<noscript><div style="position:fixed;inset:0;display:grid;place-items:center">JavaScript を有効にしてください。</div></noscript>
<div id="boot">Loading…</div>

<header class="top">
  <span class="brand">WORK&nbsp;BASE</span>
  <span class="sep"></span>
  <span class="clock" id="clock">--:--</span>
  <span class="date" id="date"></span>
  <button class="iconbtn" id="fsBtn" title="全画面（F キー / 背景をダブルクリック）" aria-label="全画面">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
  </button>
</header>

<div class="wrap">
 <div class="col left">
  <!-- Notion の完了数 -->
  <section class="card tl fixed" id="tl" title="Notion「今週の作業板」をデスクトップ版アプリで開く">
    <div class="chead"><span class="dot" style="color:var(--gold);background:var(--gold)"></span><span class="t">DONE</span><span class="j">完了済みタスク</span></div>
    <div class="done">
      <div class="big"><span id="doneN">—</span><small>tasks</small></div>
      <div class="sub"><span id="doneDelta"></span><span id="doneToday"></span></div>
      <div class="go">NOTION&nbsp;→&nbsp; <span id="doneAt"></span>
        <a class="web" id="notionWeb" href="https://www.notion.so/32667766d902813fb566d2e6d8d9513f" target="_blank" rel="noopener" title="ブラウザ版で開く">web</a>
      </div>
    </div>
  </section>

  <!-- 今日やること（秘書と決めた1〜3件・Notion から） -->
  <section class="card today fixed" id="td">
    <div class="chead"><span class="dot" style="color:#b48ead;background:#b48ead"></span><span class="t">TODAY</span><span class="j">秘書と決めた1〜3</span><span class="r" id="tdAt"></span></div>
    <div class="tlist" id="tdList"></div>
  </section>

  <!-- Obsidian 保管庫のテーマ別本数 -->
  <section class="card vault fixed" id="vt">
    <div class="chead"><span class="dot" style="color:#5cb6b3;background:#5cb6b3"></span><span class="t">VAULT</span><span class="j">保管庫のノート</span><span class="r" id="vtAt"></span></div>
    <div class="nums" id="vtNums"></div>
  </section>

  <!-- ドライブ・経理・連絡 -->
  <section class="card bl fill" id="bl">
    <div class="chead"><span class="dot" style="color:#6d8fd0;background:#6d8fd0"></span><span class="t">OFFICE</span><span class="j">経理・事務／連絡</span></div>
    <div class="scroll fade list" id="driveList"></div>
  </section>
 </div>

 <div class="col right">
  <!-- ニュース -->
  <section class="card tr half" id="tr">
    <div class="chead"><span class="dot" style="color:var(--accent);background:var(--accent)"></span><span class="t">NEWS</span><span class="j">教育・出版</span><span class="r" id="newsAt"></span></div>
    <div class="tabs" role="tablist">
      <button class="tab on" data-k="edu" role="tab">教育</button>
      <button class="tab" data-k="pub" role="tab">出版</button>
    </div>
    <div class="scroll fade news" id="newsList"><div class="empty">読み込み中…</div></div>
  </section>

  <!-- 株価・為替・投信 -->
  <section class="card mk half" id="mk">
    <div class="chead"><span class="dot" style="color:#79c7a0;background:#79c7a0"></span><span class="t">MARKETS</span><span class="j">株価・為替・投信</span><span class="r" id="mkAt"></span></div>
    <div class="scroll fade q" id="mkList"><div class="empty">読み込み中…</div></div>
  </section>

  <!-- Amazon・出版社 -->
  <section class="card br half" id="br">
    <div class="chead"><span class="dot" style="color:#d9a441;background:#d9a441"></span><span class="t">MARKET</span><span class="j">Amazon・出版社</span></div>
    <div class="scroll fade list" id="marketList"></div>
  </section>
 </div>
</div>

<!-- bottom-centre: dialogue / よく使うドライブ / 天気 -->
<div class="bottom">
  <div class="log" id="log"></div>
  <nav class="tiles" aria-label="Google workspace">
    <div class="th"><span class="t">GOOGLE</span><span class="c" id="tiCount"></span></div>
    <div class="gr" id="tiles"></div>
    <form class="ft" id="bar" autocomplete="off">
      <span class="spark"></span>

      ctx.fillStyle = "#CFE4FF"; ctx.fillRect(ss.x * W, ss.y * H, ss.r, ss.r);
    }
    ctx.globalAlpha = 1;

    var hi = hoverN || selN;

    // 球体モードの星（体積いっぱい）
    if (sph > 0.01) {
      for (var bi = 0; bi < BALL.length; bi++) {
        var bs = BALL[bi];
        var bp = project(bs.x, bs.y, bs.z);
        if (bp[0] < -20 || bp[0] > W + 20 || bp[1] < -20 || bp[1] > H + 20) continue;
        var btw = reduce ? 0.85 : (0.45 + 0.55 * Math.abs(Math.sin(t * bs.tw + bs.ph)));
        ctx.globalAlpha = Math.min(1, (bp[2] < 0 ? 0.5 : 0.88) * btw * sph);
        ctx.fillStyle = "#eef3fd";
        var br = Math.max(0.7, bs.r * bp[3] * Math.max(0.6, Math.min(cam.z, 1.8)));
        ctx.beginPath(); ctx.arc(bp[0], bp[1], br, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 位置を計算して奥→手前の順に並べる
    for (var i0 = 0; i0 < nodes.length; i0++) {
      var n0 = nodes[i0], sw = reduce ? 0 : 1;
      var ox = Math.sin(t * 0.21 * n0.sw + n0.ph) * 11 * sw, oy = Math.cos(t * 0.18 * n0.sw + n0.ph * 1.3) * 11 * sw,
          oz = Math.sin(t * 0.15 * n0.sw + n0.ph * 0.7) * 11 * sw;
      var pr = project(n0.hx + ox, n0.hy + oy, n0.hz + oz);
      n0.sx = pr[0]; n0.sy = pr[1]; n0.zz = pr[2]; n0.k = pr[3];
    }
    var order = nodes.slice().sort(function (a, b) { return a.zz - b.zz; });

    // 奥の星（霧の後ろ）
    function drawStar(n) {
      if (n.sx < -60 || n.sx > W + 60 || n.sy < -60 || n.sy > H + 60) return;
      var depth = Math.max(0.35, Math.min(1.25, n.k));
      var r = n.r * Math.max(0.5, Math.min(cam.z, 2)) * depth;
      var far = n.zz < 0 ? 0.55 : 1;                     // 奥側は少し沈める
      var dim = far;
      if (hi) dim *= (n === hi || n.gi === hi.gi) ? 1 : (n.kind === "dust" ? 0.2 : 0.3);
      var tint = n.lit || n === hi || (hi && n.gi === hi.gi) || n.glow > 0.2 ? n.col : WHITE;
      var g = n === hi ? 1 : n.glow;
      if (g > 0.02) {
        var gr = r * (5 + n.glow * 3.5);
        ctx.globalAlpha = Math.min(1, 0.6 * Math.max(dim, n.glow));
        var gg = ctx.createRadialGradient(n.sx, n.sy, 0, n.sx, n.sy, gr);
        gg.addColorStop(0, hexA(tint, 0.8 * Math.min(1, g))); gg.addColorStop(1, hexA(tint, 0));
        ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(n.sx, n.sy, gr, 0, TAU); ctx.fill();
      }
      if (n.kind !== "dust") {                          // 霧の中でも見つけられるよう芯に光を持たせる
        ctx.globalAlpha = Math.min(1, 0.32 * dim);
        var hh = ctx.createRadialGradient(n.sx, n.sy, 0, n.sx, n.sy, r * 3.4);
        hh.addColorStop(0, hexA(tint, 0.5)); hh.addColorStop(1, hexA(tint, 0));
        ctx.fillStyle = hh; ctx.beginPath(); ctx.arc(n.sx, n.sy, r * 3.4, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
      }
      var tw2 = n.kind === "dust" ? (0.45 + 0.55 * Math.abs(Math.sin(t * n.sw + n.ph))) : 1;
      ctx.globalAlpha = Math.min(1, Math.max(dim * tw2 * (n.kind === "dust" ? 0.5 : 1), n.glow));
      ctx.fillStyle = n.glow > 0.3 ? mix(tint, [255, 255, 255], Math.min(0.6, n.glow * 0.4)) : tint;
      ctx.beginPath(); ctx.arc(n.sx, n.sy, Math.max(0.6, r), 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      if (n.label && (n === hi || (hi && n.gi === hi.gi) || n.glow > 0.5)) {
        var txt = n.kind === "tool" && n.jp ? n.label + "  " + n.jp : n.label;
        ctx.globalAlpha = Math.min(1, Math.max(dim, n.glow)) * (n === hi || n.glow > 0.5 ? 1 : 0.7);
        ctx.font = (n.kind === "hub" ? "500 " : "400 ") + (n.kind === "tool" ? 11 : 12.5) + 'px "Outfit", "Zen Kaku Gothic New", sans-serif';
        ctx.textAlign = "center"; ctx.textBaseline = "top";
        var twd = ctx.measureText(txt).width;
        ctx.fillStyle = "rgba(3,5,10,.82)"; ctx.fillRect(n.sx - twd / 2 - 4, n.sy + r + 3, twd + 8, 16);
        ctx.fillStyle = n.kind === "tool" ? (n.lit ? mix(n.col, [255, 255, 255], .5) : "#f2f6ff") : mix(n.col, [255, 255, 255], .45);
        ctx.fillText(txt, n.sx, n.sy + r + 5);
        ctx.globalAlpha = 1;
      }
    }
    for (var b0 = 0; b0 < order.length; b0++) if (order[b0].zz < 0) drawStar(order[b0]);

    // 霧（星の奥と手前のあいだに挟む＝奥の星がかすむ）
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    if (sph < 0.97) { drawPuffs(PUFFS2, t); drawPuffs(PUFFS, t); }
    ctx.globalAlpha = 1;
    var hb = reduce ? 1 : (1 + Math.sin(t * 0.9) * 0.14);
    var hr = R * (1.1 + flare * 0.5) * hb;
    var hgx = CX + driftX * 0.5, hgy = CY + driftY * 0.5;
    var hg = ctx.createRadialGradient(hgx, hgy, 0, hgx, hgy, hr);
    hg.addColorStop(0, "rgba(242,246,252," + ((0.19 + flare * 0.24) * (1 - sph * 0.72)).toFixed(3) + ")");
    hg.addColorStop(0.4, "rgba(216,226,240," + ((0.09 + flare * 0.1) * (1 - sph * 0.72)).toFixed(3) + ")");
    hg.addColorStop(1, "rgba(212,222,236,0)");
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(hgx, hgy, hr, 0, TAU); ctx.fill();
    for (var mi = 0; sph < 0.97 && mi < MIST.length; mi++) {
      var mo = MIST[mi];
      if (!reduce) {
        var a3 = flow(mo.x, mo.y, t * 1.3);
        mo.x += Math.cos(a3) * mo.spd; mo.y += Math.sin(a3) * mo.spd; mo.life += mo.dcy;
      }
      var ddx = mo.x - CX, ddy = mo.y - CY;
      if (mo.life >= 1 || ddx * ddx / (R * 2.6 * R * 2.6) + ddy * ddy / (R * 1.9 * R * 1.9) > 1) {
        var na = Math.random() * TAU, nr = Math.pow(Math.random(), 0.6) * R;
        mo.x = CX + driftX + Math.cos(na) * nr * 1.2; mo.y = CY + driftY + Math.sin(na) * nr * 0.8;
        mo.life = 0; continue;
      }
      ctx.globalAlpha = mo.a * Math.sin(Math.min(1, mo.life) * Math.PI) * (hi ? 0.5 : 1) * (1 - sph * 0.7);
      ctx.drawImage(MOTE, mo.x - mo.s / 2, mo.y - mo.s / 2, mo.s, mo.s);
    }
    for (var ki = rings.length - 1; ki >= 0; ki--) {
      var rg2 = rings[ki]; rg2.t += dt * 0.5;
      if (rg2.t >= 1) { rings.splice(ki, 1); continue; }
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "rgba(226,238,255," + (0.3 * (1 - rg2.t) * rg2.p).toFixed(3) + ")";
      ctx.lineWidth = 1.2 + (1 - rg2.t) * 5;
      ctx.beginPath(); ctx.arc(CX, CY, 40 + rg2.t * Math.max(W, H) * 0.6, 0, TAU); ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // 手前の星
    for (var f0 = 0; f0 < order.length; f0++) if (order[f0].zz >= 0) drawStar(order[f0]);

    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.24, W / 2, H / 2, Math.max(W, H) * 0.78);
    vg.addColorStop(0, "rgba(5,8,16,0)"); vg.addColorStop(1, "rgba(3,5,10,.6)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    requestAnimationFrame(frame);
  }

    return "<svg class='spk' viewBox='0 0 " + w + " " + h + "' width='" + w + "' height='" + h + "' preserveAspectRatio='none'>" +
      area + "<polyline points='" + pts + "' fill='none' stroke='" + col + "' stroke-width='1.4' stroke-linejoin='round' stroke-linecap='round'/></svg>";
  }

  }
  var WX_ICON = { 0: "☀", 1: "🌤", 2: "⛅", 3: "☁", 45: "🌫", 48: "🌫", 51: "🌦", 53: "🌦", 55: "🌧", 56: "🌧", 57: "🌧",
    61: "🌧", 63: "🌧", 65: "🌧", 66: "🌧", 67: "🌧", 71: "🌨", 73: "🌨", 75: "❄", 77: "🌨", 80: "🌦", 81: "🌧", 82: "⛈",
    85: "🌨", 86: "🌨", 95: "⛈", 96: "⛈", 99: "⛈" };
  var WX_URL = { "東京": "https://tenki.jp/forecast/3/16/4410/13101/", "阿倍野": "https://tenki.jp/forecast/6/30/6200/27000/" };
  function renderWeather(w) {
    if (!w || !w.cities) return;
    var wxAt = w.updated ? "<span class='tm'>" + fmtTime(w.updated) + "</span>" : "";
    document.getElementById("wx").innerHTML = w.cities.map(function (c) {
      return "<a href='" + esc(WX_URL[c.name] || "https://tenki.jp/") + "' target='_blank' rel='noopener' title='" +
        esc(c.name + "：" + c.text + " " + Math.round(c.max) + "/" + Math.round(c.min) + "℃　降水 " + c.pop + "%　→ 明日 " + c.tomorrow.text + " " + Math.round(c.tomorrow.max) + "/" + Math.round(c.tomorrow.min) + "℃") + "'>" +
        "<span class='ic'>" + (WX_ICON[c.code] || "・") + "</span><span>" + esc(c.name) + "</span>" +
        "<span class='t'>" + Math.round(c.temp) + "°</span>" +
        "<span class='mm'>" + Math.round(c.max) + "/" + Math.round(c.min) + "</span>" +
        (c.pop >= 40 ? "<span class='pop'>☂" + c.pop + "%</span>" : "") +
        "<span class='mm'>→ " + (WX_ICON[c.tomorrow.code] || "・") + " " + Math.round(c.tomorrow.max) + "/" + Math.round(c.tomorrow.min) + "</span></a>";
    }).join("") + wxAt;
  }

  // ================================================================= DATA (Notion / news)
  var FALLBACK_NOTION = { updated: "2026-09-21T17:22:57+09:00", done: 485, today: 9, history: { "2026-09-21": 485 } };
  var news = null, newsTab = "edu", seenNews = null, lastDone = null;
  try { newsTab = localStorage.getItem("wb-news-tab") || "edu"; } catch (x) {}
  try { seenNews = JSON.parse(localStorage.getItem("wb-seen") || "null"); } catch (x) {}

  function getJSON(path) {
    return fetch(path + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function jstDay(d) { return new Date(d.getTime() + 9 * 3600e3).toISOString().slice(0, 10); }
  function fmtTime(iso) { var d = new Date(iso); return (d.getMonth() + 1) + "/" + d.getDate() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function ago(iso) {
    if (!iso) return "";
    var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 1) return "たった今"; if (m < 60) return m + "分前";
    var h = Math.round(m / 60); if (h < 24) return h + "時間前";
    return Math.round(h / 24) + "日前";
  }
  function ping(id) { var el = document.getElementById(id); el.classList.add("ping"); setTimeout(function () { el.classList.remove("ping"); }, 2600); }

  function countUp(el, to) {
    var from = parseInt(el.textContent, 10); if (isNaN(from)) from = Math.max(0, to - 60);
    var s = performance.now(), dur = reduce ? 1 : 1400;
    (function step(now) {
      var k = Math.min(1, (now - s) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(step);
    })(s);
  }
  function renderNotion(n) {
    countUp(document.getElementById("doneN"), n.done);
    var today = jstDay(new Date()), base = null;
    Object.keys(n.history || {}).sort().forEach(function (d) { if (d < today) base = n.history[d]; });
    document.getElementById("doneDelta").innerHTML = base != null ? "今日 <b>+" + Math.max(0, n.done - base) + "</b>" : "";
    document.getElementById("doneToday").innerHTML = n.today != null ? "今日やること <b>" + n.today + "</b>" : "";
    document.getElementById("doneAt").textContent = n.updated ? fmtTime(n.updated) + " 時点" : "";
    focusItems = (n.focus || []).slice(0, 3);
    renderToday();
    if (lastDone != null && n.done > lastDone) { ping("tl"); flareUp(0.7); }
    lastDone = n.done;
  }
  function renderNews() {
    var box = document.getElementById("newsList");
    document.querySelectorAll(".tab").forEach(function (b) { b.classList.toggle("on", b.dataset.k === newsTab); });
    var items = news && news[newsTab];
    if (!items || !items.length) { box.innerHTML = "<div class='empty'>ニュースはまだ届いていません。<br>（GitHub で公開すると毎時自動で更新されます）</div>"; return; }
    box.innerHTML = items.map(function (x) {
      var fresh = x.time && (Date.now() - new Date(x.time).getTime()) < 3 * 3600e3;
      return "<a href='" + esc(x.url) + "' target='_blank' rel='noopener'><div class='h'>" + esc(x.title) + "</div>" +
        "<div class='m'>" + (fresh ? "<span class='new'>●</span>" : "") + "<span class='src'>" + esc(x.source) + "</span><span class='ago'>" + ago(x.time) + "</span></div></a>";
    }).join("");
    box.scrollTop = 0;
    document.getElementById("newsAt").textContent = news.updated ? "更新 " + fmtTime(news.updated) : "";
  }
  document.querySelectorAll(".tab").forEach(function (b) {
    b.addEventListener("click", function () { newsTab = b.dataset.k; try { localStorage.setItem("wb-news-tab", newsTab); } catch (x) {} renderNews(); });
  });

  function loadData(first) {
    getJSON("data/notion.json").then(renderNotion, function () { if (first === true) renderNotion(FALLBACK_NOTION); });
    getJSON("data/news.json").then(function (j) {
      news = j; renderNews();
      var head = (j.edu && j.edu[0] && j.edu[0].url) + "|" + (j.pub && j.pub[0] && j.pub[0].url);
      if (seenNews && seenNews !== head) { ping("tr"); flareUp(0.5); say("新しいニュースが入りました"); }
      seenNews = head; try { localStorage.setItem("wb-seen", JSON.stringify(head)); } catch (x) {}
    }, function () { if (first === true) renderNews(); });
    getJSON("data/market.json").then(renderMarket, function () { if (first === true) renderMarket(null); });
    getJSON("data/weather.json").then(renderWeather, function () {});
    getJSON("data/obsidian.json").then(renderVault, function () { if (first === true) renderVault(null); });
  }

  // ================================================================= DIALOGUE (form only — AI later)
  var logEl = document.getElementById("log");
  function say(text, who) {
    var d = document.createElement("div");
    d.className = "ln" + (who === "me" ? " me" : "");
    d.textContent = text;
    logEl.appendChild(d);
    while (logEl.children.length > 3) logEl.removeChild(logEl.firstChild);
    var all = logEl.children;
    for (var i = 0; i < all.length; i++) all[i].classList.toggle("old", i < all.length - 2);
    clearTimeout(say.t); say.t = setTimeout(function () { logEl.innerHTML = ""; }, 14000);
  }
  function norm(s) { return s.toLowerCase().replace(/[\s・　]/g, ""); }
  function findTools(q) {
    var nq = norm(q);
    if (!nq) return [];
    return nodes.filter(function (n) {
      if (n.kind !== "tool") return false;
      var en = norm(n.label), jp = norm(n.jp || "");
      return en.indexOf(nq) >= 0 || (jp && (jp.indexOf(nq) >= 0 || nq.indexOf(jp) >= 0)) || (nq.length > 3 && nq.indexOf(en) >= 0);
    });
  }
  document.getElementById("bar").addEventListener("submit", function (e) {
    e.preventDefault();
    var inp = document.getElementById("cmd"), q = inp.value.trim();
    inp.value = "";
    flareUp(1);
    if (!q) return;
    say(q, "me");
    if (/^(全画面|ぜんがめん|full(screen)?|fs)$/i.test(q)) { toggleFS(); say("全画面を切り替えました"); return; }
    if (/^(色リセット|色をリセット|白に戻す|reset ?colors?)$/i.test(q)) {
      nodes.forEach(function (n) { n.lit = false; }); LIT = {}; saveLit(); say("星を白に戻しました"); return;
    }
    if (/^(球体|球|sphere|ball)$/i.test(q)) { toggleSphere(); return; }
    var ed = q.match(/^(編集中|へんしゅうちゅう|editing)\s*(.*)$/i);
    if (ed) { findEditing(ed[2].trim()); say(ed[2].trim() ? "「" + ed[2].trim() + "」を編集中フォルダで探します" : "編集中フォルダを開きました"); return; }
    if (/^(リセット|reset|home)$/i.test(q)) {
      resetView(); say("視点を戻しました"); return;
    }
    var wantsOpen = /(開いて|ひらいて|開く)$|^(open|o)\s/i.test(q);
    var key = q.replace(/(を)?(開いて|ひらいて|開く)$/, "").replace(/^(open|o)\s+/i, "").trim();
    var hits = findTools(key);
    if (hits.length) {
      hits.forEach(function (n) { n.glow = 1.6; var hub = GROUPS[n.gi].node; hub.glow = Math.max(hub.glow, 1); });
      if (wantsOpen && hits.length === 1) { litUp(hits[0]); window.open(hits[0].url, "_blank", "noopener"); say(hits[0].label + " を開きました"); }
      else say(hits.map(function (n) { return n.label; }).join("・") + " を光らせました — 星をクリックで開きます");
    } else {
      say("（対話 AI はまだ準備中です。いまは星の名前で光らせたり、「〜を開いて」で開いたりできます）");
    }
  });

  // ================================================================= START
  var __b = document.getElementById("boot"); if (__b) __b.parentNode.removeChild(__b);
  resize();
  var z0 = fitZ(); cam.z = z0 * 0.55;
  camT = { t0: performance.now(), dur: 1600, fx: 0, fy: 0, fz: z0 * 0.55, tx: 0, ty: 0, tz: z0 };
  setTimeout(function () { flareUp(0.8); }, 900);
  loadData(true);
  setInterval(loadData, DATA_REFRESH_MIN * 60000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) loadData(); });
  requestAnimationFrame(frame);
} catch (e) { __bootErr(e); }
})();
</script>
</body>
</html>
