<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work Base</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23070b16'/><circle cx='32' cy='32' r='8' fill='%23bfe6ff'/><g stroke='%234a6fa5' stroke-width='1.5' opacity='.8' fill='none'><path d='M32 32 L15 16'/><path d='M32 32 L50 15'/><path d='M32 32 L14 48'/><path d='M32 32 L50 49'/></g><circle cx='15' cy='16' r='3.4' fill='%236cc0a0'/><circle cx='50' cy='15' r='3.4' fill='%234fb5c8'/><circle cx='14' cy='48' r='3.4' fill='%23a58fd0'/><circle cx='50' cy='49' r='3.4' fill='%23d8b45a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
  :root{
    --bg0:#0f1830; --bg1:#0a0f1f; --bg2:#05070f;
    --ink:#dfe8f6; --dim:#8595b4; --faint:#5b6a8c;
    --line:#2c3e63;
    --g-base:#6cc0a0; --g-prog:#4fb5c8; --g-market:#d8b45a;
    --g-comp:#a58fd0; --g-office:#6f97e0; --g-other:#d98f88;
    --core:#bfe6ff;
    --enfont:"Chakra Petch",system-ui,sans-serif;
    --jpfont:"Zen Kaku Gothic New",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(ellipse 90% 70% at 50% 40%,var(--bg0),var(--bg1) 42%,var(--bg2) 100%);
    color:var(--ink);font-family:var(--enfont);overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0}
  svg#net{position:absolute;inset:0;width:100%;height:100%}

  /* ---- links ---- */
  .link{fill:none;stroke-linecap:round}
  .spoke{stroke-width:1.8;opacity:.7}
  .twig{stroke-width:1;opacity:.5}
  svg#net.intro .link{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
    animation:draw .9s ease forwards;animation-delay:var(--d)}
  @keyframes draw{to{stroke-dashoffset:0}}

  /* ---- nodes ---- */
  .node{cursor:pointer}
  .node circle.dot{transition:r .18s ease,filter .18s ease}
  .node .en{font-size:10.5px;letter-spacing:.06em;fill:var(--faint);
    pointer-events:none;transition:fill .18s ease}
  .hub .en{font-size:12px;letter-spacing:.14em;fill:var(--dim);text-transform:uppercase}
  .node:focus{outline:none}
  .node:focus circle.dot{stroke:#fff;stroke-width:1.4}

  svg#net.intro .node{opacity:0;animation:pop .5s ease forwards;animation-delay:var(--d)}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  .node{transform-box:fill-box;transform-origin:center}

  /* hover / lit state (after intro) */
  svg#net.ready .node:hover circle.dot,
  svg#net.ready .node.lit circle.dot{r:var(--rlit);filter:url(#glow)}
  svg#net.ready .node:hover .en,
  svg#net.ready .node.lit .en{fill:var(--ink)}
  svg#net.ready.dim .node:not(.lit){opacity:.28;transition:opacity .2s}
  svg#net.ready.dim .link:not(.lit){opacity:.08;transition:opacity .2s}
  svg#net.ready .link{transition:opacity .2s,stroke-width .2s}
  svg#net.ready .link.lit{stroke-width:2.2;opacity:.95}

  /* ---- core overlay ---- */
  #core{position:absolute;left:50%;top:41%;transform:translate(-50%,-50%);
    text-align:center;pointer-events:none;width:min(80vw,420px)}
  #clock{font-weight:300;font-size:clamp(26px,4.4vw,44px);letter-spacing:.1em;
    color:#eaf4ff;text-shadow:0 0 22px rgba(150,205,255,.4)}
  #date{margin-top:1px;font-size:clamp(10px,1.3vw,12px);letter-spacing:.34em;
    color:var(--dim);text-transform:uppercase}
  #search{margin-top:16px;pointer-events:auto;display:flex;justify-content:center}
  #search input{
    width:min(76vw,320px);background:rgba(9,14,28,.9);
    border:1px solid #33477199;border-radius:999px;color:var(--ink);
    padding:9px 16px;font-family:var(--jpfont);font-size:13px;outline:none;
    box-shadow:0 0 0 1px rgba(120,170,255,.05),0 8px 30px rgba(0,0,0,.4)}
  #search input:focus{border-color:#4d74b8;box-shadow:0 0 0 3px rgba(90,150,240,.14)}
  #search input::placeholder{color:var(--faint)}
  #qlinks{margin-top:9px;font-size:11px;letter-spacing:.02em;
    font-family:var(--jpfont);color:var(--faint);pointer-events:auto}
  #qlinks a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent}
  #qlinks a:hover{color:var(--ink);border-bottom-color:var(--faint)}
  #qlinks span{margin:0 7px;opacity:.4}

  /* ---- tooltip ---- */
  #tip{position:absolute;pointer-events:none;font-family:var(--jpfont);
    font-size:12px;color:var(--ink);background:rgba(10,16,32,.92);
    border:1px solid #2b3a5e;border-radius:7px;padding:4px 9px;white-space:nowrap;
    opacity:0;transform:translateY(3px);transition:opacity .13s,transform .13s;
    box-shadow:0 6px 22px rgba(0,0,0,.45);z-index:5}
  #tip.on{opacity:1;transform:translateY(0)}
  #tip b{font-weight:500}
  #tip i{font-style:normal;color:var(--faint);margin-left:7px;font-size:10.5px}

  /* ---- side panel ---- */
  #peekbtn{position:absolute;top:16px;right:16px;z-index:6;
    background:rgba(12,20,40,.72);border:1px solid #2c3e63;border-radius:8px;
    color:var(--dim);font-family:var(--jpfont);font-size:12px;letter-spacing:.06em;
    padding:7px 12px;cursor:pointer}
  #peekbtn:hover{color:var(--ink);border-color:#4d74b8}
  #peek{position:absolute;top:0;right:0;height:100%;width:min(92vw,380px);z-index:7;
    background:linear-gradient(180deg,rgba(9,14,28,.98),rgba(7,11,22,.98));
    border-left:1px solid #22314f;transform:translateX(100%);
    transition:transform .28s ease;display:flex;flex-direction:column;padding:14px}
  #peek.open{transform:translateX(0)}
  #peek header{display:flex;justify-content:space-between;align-items:center;
    color:var(--dim);font-size:12px;letter-spacing:.2em;text-transform:uppercase;
    padding-bottom:10px;border-bottom:1px solid #1c2740}
  #peek header button{background:none;border:none;color:var(--faint);font-size:18px;
    cursor:pointer;line-height:1}
  #peek header button:hover{color:var(--ink)}
  #peek iframe{width:100%;flex:1;border:0;border-radius:8px;margin-top:12px;
    background:#0b1120;min-height:280px}
  #peek .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  #peek .btns a{flex:1;text-align:center;min-width:120px;text-decoration:none;
    font-family:var(--jpfont);font-size:12px;color:var(--dim);
    border:1px solid #2c3e63;border-radius:8px;padding:9px 6px}
  #peek .btns a:hover{color:var(--ink);border-color:#4d74b8}
  #peek .note{color:var(--faint);font-size:10.5px;font-family:var(--jpfont);
    margin-top:10px;line-height:1.5}

  /* ---- note (bottom-left) ---- */
  #memo{position:absolute;left:16px;bottom:14px;z-index:4;width:min(60vw,240px)}
  #memo textarea{width:100%;height:52px;resize:none;background:rgba(10,16,32,.5);
    border:1px solid #1e2b47;border-radius:8px;color:var(--dim);
    font-family:var(--jpfont);font-size:11.5px;padding:7px 9px;outline:none}
  #memo textarea:focus{border-color:#3a568c;color:var(--ink)}

  @media (prefers-reduced-motion:reduce){
    svg#net.intro .link{stroke-dashoffset:0;animation:none}
    svg#net.intro .node{opacity:1;animation:none}
  }
  @media (max-width:640px){
    #memo{display:none}
    #core{top:42%}
  }
</style>
</head>
<body>
<div id="stage">
  <svg id="net" class="intro" viewBox="0 0 1200 780" preserveAspectRatio="xMidYMid meet" aria-label="仕事ツール">
    <defs>
      <radialGradient id="coreg" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#eaf6ff" stop-opacity=".95"/>
        <stop offset="22%" stop-color="#9fd2ff" stop-opacity=".55"/>
        <stop offset="55%" stop-color="#3f6fae" stop-opacity=".18"/>
        <stop offset="100%" stop-color="#3f6fae" stop-opacity="0"/>
      </radialGradient>
      <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="3.4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="softglow" x="-120%" y="-120%" width="340%" height="340%">
        <feGaussianBlur stdDeviation="10"/>
      </filter>
    </defs>
    <g id="stars"></g>
    <circle id="corehalo" cx="600" cy="352" r="110" fill="url(#coreg)"/>
    <circle cx="600" cy="352" r="2.6" fill="#eaf6ff"/>
    <g id="links"></g>
    <g id="nodes"></g>
  </svg>

  <div id="core">
    <div id="clock">--:--</div>
    <div id="date">&nbsp;</div>
    <div id="search">
      <input id="q" type="text" autocomplete="off" spellcheck="false"
        placeholder="編集中フォルダを検索  ―  先生名 / 書名" aria-label="編集中フォルダを検索">
    </div>
    <div id="qlinks">
      <a id="ql-fold" href="#" target="_blank" rel="noopener">編集中フォルダ</a>
      <span>/</span>
      <a id="ql-pub" href="#" target="_blank" rel="noopener">刊行一覧</a>
    </div>
  </div>

  <button id="peekbtn" type="button">◱ 予定 &amp; メモ</button>
  <aside id="peek" aria-hidden="true">
    <header><span>眺めるだけ</span><button id="peekclose" type="button" aria-label="閉じる">×</button></header>
    <iframe id="cal" title="Google カレンダー" loading="lazy"></iframe>
    <div class="btns">
      <a id="nb" href="#" target="_blank" rel="noopener">Notion 作業板</a>
      <a id="nt" href="#" target="_blank" rel="noopener">Notion タスクメモ</a>
      <a id="calfull" href="https://calendar.google.com/calendar/r?authuser=0" target="_blank" rel="noopener">カレンダーを開く</a>
    </div>
    <p class="note">書き込みは各サービスで。ここは表示だけです。<br>
      カレンダーが空欄のときは「カレンダーを開く」からログイン状態を確認してください。</p>
  </aside>

  <div id="memo"><textarea id="memotext" placeholder="今日のメモ（この端末に保存）"></textarea></div>
</div>

<div id="tip"></div>

<script>
(function(){
  "use strict";

  /* ============ CONFIG ─ ここだけ直せば中身を差し替えられます ============ */
  var A = "authuser=0";
  var EDIT_PARENT = "19e1XLVpyfmhm_oGxluYGKvCx4u8auywX";      // Google Drive「編集中」フォルダ ID
  var DRIVE_SEARCH = "https://drive.google.com/drive/u/0/search?q=";
  var CAL_SRC   = "kitayama@toyokan.co.jp";                    // ← カレンダーのアドレス（要確認）
  var NOTION_BOARD = "https://www.notion.so/";                 // ← Notion 作業板 URL（要差し替え）
  var NOTION_TASKS = "https://www.notion.so/";                 // ← Notion タスクメモ URL（要差し替え）
  var PUBLISHED_LIST = DRIVE_SEARCH + encodeURIComponent("刊行一覧");

  var GROUPS = [
    { key:"base",   en:"Base",        jp:"社内",      col:"var(--g-base)" },
    { key:"prog",   en:"In Progress", jp:"進行中",    col:"var(--g-prog)" },
    { key:"market", en:"Market",      jp:"市場",      col:"var(--g-market)" },
    { key:"comp",   en:"Competitors", jp:"他社",      col:"var(--g-comp)" },
    { key:"office", en:"Office",      jp:"経理・事務", col:"var(--g-office)" },
    { key:"other",  en:"Other",       jp:"そのほか",  col:"var(--g-other)" }
  ];

  var TOOLS = {
    base:[
      ["Gmail","Gmail","https://mail.google.com/mail/?"+A],
      ["Calendar","カレンダー","https://calendar.google.com/calendar/r?"+A],
      ["Portal","東洋館ポータル","https://sites.google.com/toyokan.co.jp/portal/%E3%83%9B%E3%83%BC%E3%83%A0?"+A],
      ["Toyokan","東洋館サイト","https://www.toyokan.co.jp/"]
    ],
    prog:[
      ["Projects","企画一覧シート","https://docs.google.com/spreadsheets/d/1XI3lXlDdiK_qWv9MNIamiDzWLgY-mS5vmnK3rmb04rw/edit?"+A],
      ["Editing","編集中フォルダ","https://drive.google.com/drive/folders/19e1XLVpyfmhm_oGxluYGKvCx4u8auywX?"+A],
      ["Management","管理フォルダ","https://drive.google.com/drive/folders/1-kgoU2Rb5EyUhGzumdMvEN7YznB5exCP?"+A],
      ["Proposals","企画書フォルダ","https://drive.google.com/drive/folders/1Zkz084sQ6FpfXGKSUZHXyjAkyc6zD0RZ?"+A]
    ],
    market:[
      ["Amazon all","Amazon 総合","https://www.amazon.co.jp/gp/bestsellers/books/"],
      ["Amazon TK","Amazon 東洋館","https://www.amazon.co.jp/gp/bestsellers/books/12874471"],
      ["New: teach","教師向け新刊","https://www.amazon.co.jp/gp/new-releases/books/554292/"],
      ["Biz how-to","ビジネス実用","https://www.amazon.co.jp/gp/bestsellers/books/492066"],
      ["Edu rank","教育書ランキング","https://www.amazon.co.jp/gp/bestsellers/books/2257225051"],
      ["Edu / prac","教育・実務書","https://www.amazon.co.jp/gp/bestsellers/books/12867251"],
      ["honto","honto","https://honto.jp/"]
    ],
    comp:[
      ["Meiji","明治図書","https://www.meijitosho.co.jp/search/?title=%90V%8A%A7%8F%91%90%D0"],
      ["Gakuyo","学陽書房","https://www.gakuyo.co.jp/search/g6008.html"],
      ["Gakuji","学事出版","https://www.gakuji.co.jp/"],
      ["Reimei","黎明書房","http://www.reimei-shobo.com/"],
      ["Mirai","学芸みらい社","https://www.gakugeimirai.jp/"],
      ["Forum A","フォーラム・A","https://foruma.co.jp/"]
    ],
    office:[
      ["Attend","勤怠","https://s2.kingtime.jp/independent/recorder2/personal/"],
      ["Expense","MF 経費","https://expense.moneyforward.com/routine_route"],
      ["Payable","MF 債務","https://payable.moneyforward.com/"],
      ["CloudSign","クラウドサイン","https://app.cloudsign.jp/"],
      ["Yamato B2","ヤマト B2","https://bmypage.kuronekoyamato.co.jp/bmypage/servlet/jp.co.kuronekoyamato.wur.hmp.servlet.user.HMPLGI0010JspServlet"]
    ],
    other:[
      ["Coworking","コワーキング","https://jrwd-workspace.com/"],
      ["Messenger","Messenger","https://www.facebook.com/messages/"]
    ]
  };

  /* ============ layout ============ */
  var CX=600, CY=344, TAU=Math.PI*2;
  var CORE_VOID=92;                  // 中央のUI用の空白半径
  var ANG0=-Math.PI/2 + Math.PI/6 + 0.17;  // 30°+約10° 回転：真上真下・水平の桟を避ける
  var svg=document.getElementById("net"),
      LG=document.getElementById("links"),
      NG=document.getElementById("nodes"),
      SG=document.getElementById("stars");
  var SVGNS="http://www.w3.org/2000/svg";
  function el(n,a){var e=document.createElementNS(SVGNS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}

  // starfield (static)
  (function(){
    for(var i=0;i<70;i++){
      var x=Math.random()*1200, y=Math.random()*780,
          r=Math.random()*1.1+.2, o=Math.random()*.5+.12;
      SG.appendChild(el("circle",{cx:x.toFixed(1),cy:y.toFixed(1),r:r.toFixed(2),
        fill:"#9fb6dd","fill-opacity":o.toFixed(2)}));
    }
  })();

  var HUBR_X=316, HUBR_Y=228, delayN=0;
  var lit = {};   // group.key -> array of elements to light together

  function path(x1,y1,x2,y2,bow){
    var mx=(x1+x2)/2, my=(y1+y2)/2, dx=x2-x1, dy=y2-y1,
        L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L, k=bow*L;
    return "M"+x1.toFixed(1)+" "+y1.toFixed(1)+" Q"+(mx+nx*k).toFixed(1)+" "+(my+ny*k).toFixed(1)+" "+x2.toFixed(1)+" "+y2.toFixed(1);
  }
  function addLink(cls,d,col,delay){
    var p=el("path",{class:"link "+cls,d:d,stroke:col});
    var len=p.getTotalLength ? 0 : 0;
    LG.appendChild(p);
    var L=p.getTotalLength();
    p.style.setProperty("--len",L.toFixed(0));
    p.style.setProperty("--d",delay.toFixed(2)+"s");
    return p;
  }

  GROUPS.forEach(function(g,gi){
    var ang = ANG0 + gi*(TAU/GROUPS.length);
    var hx = CX + Math.cos(ang)*HUBR_X,
        hy = CY + Math.sin(ang)*HUBR_Y;
    var groupEls=[];

    // spoke: core void edge -> hub
    var sx=CX+Math.cos(ang)*CORE_VOID, sy=CY+Math.sin(ang)*CORE_VOID*0.92;
    var sp=addLink("spoke",path(sx,sy,hx,hy,0.05),g.col,0.15+gi*0.05);
    groupEls.push(sp);

    // hub node
    var hub=mkNode({en:g.en,x:hx,y:hy,col:g.col,r:5.5,rlit:8,hub:true,ang:ang,delay:0.5+gi*0.06});
    groupEls.push(hub);

    // tools fan out from hub direction
    var list=TOOLS[g.key]||[], n=list.length;
    list.forEach(function(t,ti){
      var f = n===1 ? 0 : (ti/(n-1) - 0.5);      // -0.5 .. 0.5
      var spread = Math.min(1.4, 0.26*n);
      var ta = ang + f*spread;
      var rr = 128 + (ti%2)*50;
      var tx = hx + Math.cos(ta)*rr,
          ty = hy + Math.sin(ta)*rr*0.82;
      var lk=addLink("twig",path(hx,hy,tx,ty,0.10),g.col,1.0+ (delayN*0.035));
      var nd=mkNode({en:t[0],jp:t[1],url:t[2],x:tx,y:ty,col:g.col,r:3.4,rlit:6.2,
        ang:ta,delay:1.15+delayN*0.045});
      delayN++;
      groupEls.push(lk,nd);
      nd._group=g.key; lk._group=g.key;
    });
    hub._group=g.key; sp._group=g.key;
    lit[g.key]=groupEls;
  });

  function mkNode(o){
    var g=el("g",{class:"node"+(o.hub?" hub":""),tabindex:"0"});
    g.style.setProperty("--d",o.delay.toFixed(2)+"s");
    g.style.setProperty("--rlit",o.rlit);
    g.appendChild(el("circle",{class:"dot",cx:o.x.toFixed(1),cy:o.y.toFixed(1),
      r:o.r,fill:o.col}));
    // label placement: outward from centre
    var lx=o.x + Math.cos(o.ang)*(o.hub?16:12),
        ly=o.y + Math.sin(o.ang)*(o.hub?16:12) + 3.5;
    var anchor = Math.cos(o.ang) < -0.25 ? "end" : (Math.cos(o.ang) > 0.25 ? "start":"middle");
    var tx=el("text",{class:"en",x:lx.toFixed(1),y:ly.toFixed(1),"text-anchor":anchor});
    tx.textContent=o.en;
    g.appendChild(tx);
    if(o.url){ g._url=o.url; g._jp=o.jp; g._en=o.en; }
    NG.appendChild(g);

    g.addEventListener("mouseenter",function(){ enter(g); });
    g.addEventListener("mouseleave",leave);
    g.addEventListener("focus",function(){ enter(g); });
    g.addEventListener("blur",leave);
    g.addEventListener("click",function(){ if(g._url) window.open(g._url,"_blank","noopener"); });
    g.addEventListener("keydown",function(e){
      if((e.key==="Enter"||e.key===" ")&&g._url){ e.preventDefault(); window.open(g._url,"_blank","noopener"); }
    });
    return g;
  }

  var tip=document.getElementById("tip");
  function enter(g){
    if(!svg.classList.contains("ready")) return;
    var key=g._group; if(!key) return;
    svg.classList.add("dim");
    (lit[key]||[]).forEach(function(e){ e.classList.add("lit"); });
    if(g._url){
      tip.innerHTML="<b>"+g._jp+"</b><i>"+g._en+"</i>";
      var box=g.getBoundingClientRect();
      tip.classList.add("on");
      var cx=Math.max(70,Math.min(window.innerWidth-70, box.left+box.width/2));
      tip.style.left=cx+"px";
      tip.style.top=Math.max(24,box.top-10)+"px";
      tip.style.transform="translate(-50%,-100%)";
    }
  }
  function leave(){
    svg.classList.remove("dim");
    document.querySelectorAll(".node.lit,.link.lit").forEach(function(e){e.classList.remove("lit");});
    tip.classList.remove("on");
  }

  /* ============ intro -> settle ============ */
  var totalDelay = 1.15 + delayN*0.045 + 0.9;
  setTimeout(function(){
    svg.classList.remove("intro");
    svg.classList.add("ready");
  }, Math.min(totalDelay*1000+200, 4200));

  /* ============ keep #core centred on the SVG core ============ */
  var coreEl=document.getElementById("core");
  function placeCore(){
    var r=svg.getBoundingClientRect();
    var s=Math.min(r.width/1200, r.height/780);
    var ox=r.left+(r.width-1200*s)/2, oy=r.top+(r.height-780*s)/2;
    coreEl.style.left=(ox+CX*s)+"px";
    coreEl.style.top=(oy+CY*s)+"px";
  }
  placeCore();
  window.addEventListener("resize",placeCore);
  setTimeout(placeCore,300);

  /* ============ clock ============ */
  var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  function tick(){
    var d=new Date();
    var hh=String(d.getHours()).padStart(2,"0"), mm=String(d.getMinutes()).padStart(2,"0");
    document.getElementById("clock").textContent=hh+":"+mm;
    document.getElementById("date").textContent=
      d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0")
      +"  "+DOW[d.getDay()];
  }
  tick(); setInterval(tick,15000);

  /* ============ 編集中 search ============ */
  var q=document.getElementById("q");
  function runSearch(){
    var v=q.value.trim();
    var query = v ? ("parent:"+EDIT_PARENT+" type:folder "+v) : ("parent:"+EDIT_PARENT+" type:folder");
    window.open(DRIVE_SEARCH+encodeURIComponent(query),"_blank","noopener");
  }
  q.addEventListener("keydown",function(e){ if(e.key==="Enter") runSearch(); });
  document.getElementById("ql-fold").href="https://drive.google.com/drive/folders/"+EDIT_PARENT+"?"+A;
  document.getElementById("ql-pub").href=PUBLISHED_LIST;

  /* ============ side panel ============ */
  var peek=document.getElementById("peek");
  function setPeek(open){
    peek.classList.toggle("open",open);
    peek.setAttribute("aria-hidden",open?"false":"true");
    var cal=document.getElementById("cal");
    if(open && !cal.src){
      cal.src="https://calendar.google.com/calendar/embed?src="+encodeURIComponent(CAL_SRC)
        +"&ctz=Asia%2FTokyo&mode=AGENDA&showTitle=0&showNav=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0&bgcolor=%230b1120";
    }
  }
  document.getElementById("peekbtn").addEventListener("click",function(){setPeek(!peek.classList.contains("open"));});
  document.getElementById("peekclose").addEventListener("click",function(){setPeek(false);});
  document.getElementById("nb").href=NOTION_BOARD;
  document.getElementById("nt").href=NOTION_TASKS;

  /* ============ memo ============ */
  var mt=document.getElementById("memotext");
  try{ mt.value=localStorage.getItem("workbase.memo")||""; }catch(e){}
  mt.addEventListener("input",function(){ try{localStorage.setItem("workbase.memo",mt.value);}catch(e){} });

})();
</script>
</body>
</html>
