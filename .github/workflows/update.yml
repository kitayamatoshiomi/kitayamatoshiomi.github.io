name: update data

on:
  schedule:
    - cron: "5 * * * *"   # 毎時5分（UTC）。朝9時台（JST）も含む
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch news / notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/update.py
      - name: commit if changed
        run: |
          git config user.name "workbase-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')" && git push)
